# Publishes results of the `benchmarks` workflow: a pending status when it
# starts, then one PR comment (updated in place) and a pass/fail status.
#
# workflow_run always runs the version of this file on the default branch,
# with a write token, and never executes code from the PR. The artifact it
# downloads is untrusted data; `bot publish` validates it before posting.
name: benchmark report

on:
  workflow_run:
    workflows: [benchmarks]
    types: [requested, completed]

permissions:
  actions: read         # download the other run's artifact
  contents: read
  issues: write         # PR comments use the issues API
  pull-requests: write
  statuses: write

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out default branch (trusted code)
        uses: actions/checkout@v4

      # This repo's own action (action.yml), the same one other repos use.
      - name: Mark pending
        if: github.event.action == 'requested'
        uses: ./
        with:
          mode: pending

      - name: Publish comment and status
        if: github.event.action == 'completed'
        uses: ./
        with:
          mode: publish
