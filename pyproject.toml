[project]
name = "benchwatch"
version = "0.1.0"
description = "Detects statistically meaningful benchmark regressions between two commits"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "rich>=13.7",
    "scipy>=1.13",
    "typer>=0.12",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.scripts]
bot = "benchwatch.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
